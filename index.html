<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <h1>Weather App</h1>

        <!-- Search -->
        <div class="search-box">
            <input 
                type="text" 
                id="city-input" 
                placeholder="Enter city name"
            >

            <button id="search-btn">
                Search
            </button>
        </div>

        <!-- Weather Card -->
        <section class="weather-card">

            <div class="location">
                <h2 id="city">Davangere</h2>
                <p id="date">Tuesday, August 18</p>
            </div>

            <div class="weather-main">

                <div class="weather-icon" id="weather-icon">
                    ☀️
                </div>

                <div class="temperature">
                    <span id="temperature">28</span>°C
                </div>

                <div class="condition" id="condition">
                    Clear Sky
                </div>

            </div>

            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail">
                    <p>Feels Like</p>
                    <h3 id="feels-like">30°C</h3>
                </div>

                <div class="detail">
                    <p>Humidity</p>
                    <h3 id="humidity">65%</h3>
                </div>

                <div class="detail">
                    <p>Wind</p>
                    <h3 id="wind">12 km/h</h3>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
